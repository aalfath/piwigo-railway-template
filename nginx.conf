user                            nginx;
worker_processes                2;
error_log                       /dev/stderr;

events {
    worker_connections          1024;
}

http {
    include                     /etc/nginx/mime.types;
    default_type                application/octet-stream;
    sendfile                    on;
    access_log                  /dev/stdout;
    keepalive_timeout           65;

    server {
        # Port is rewritten from $PORT at start (/railway/init.sh).
        listen                  8080;
        root                    /var/www/html/piwigo;
        index                   index.php index.html index.htm;
        server_name             _;
        client_max_body_size    100m;

        # Health check for Railway: answers 200 only when PHP and the database work.
        location = /healthz {
            access_log          off;
            fastcgi_param       SCRIPT_FILENAME /railway/health.php;
            fastcgi_param       SCRIPT_NAME     /healthz;
            fastcgi_param       REQUEST_METHOD  $request_method;
            fastcgi_param       QUERY_STRING    $query_string;
            fastcgi_pass        127.0.0.1:9000;
        }

        # Never serve the database settings or Piwigo's logs.
        location ~ ^/(local/config|_data/logs)/ {
            deny                all;
        }

        error_page              500 502 503 504  /50x.html;
        location = /50x.html {
            root                /var/lib/nginx/html;
        }

        location ~ \.php$ {
            fastcgi_pass        127.0.0.1:9000;
            fastcgi_index       index.php;
            include             fastcgi.conf;
            fastcgi_read_timeout 300;
        }
    }
}
